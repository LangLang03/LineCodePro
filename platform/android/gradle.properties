org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
huxeruiCompileSdk=36
huxeruiMinCompileSdk=23
huxeruiMinSdk=23
huxeruiTargetSdk=36
huxeruiNdkVersion=29.0.14206865
huxeruiAbis=arm64-v8a,x86_64
huxeruiStl=c++_shared
huxeruiBuildNative=false

# Local model (llama.cpp) build parameters.
#
# The defaults keep the shipped artifact free of llama.cpp: nothing includes
# llama.h, nothing links the runtime, and the local-model entry points are not
# compiled into the UI. Enable `linecodeEnableLocalModel` for a build that
# supports GGUF models, and `linecodeLocalModelBundle` for one whose native
# libraries are packaged into the APK.
linecodeEnableLocalModel=false
linecodeLocalModelBundle=false
# Accelerators requested when the local model support is on. Each request is
# narrowed to what the resolved llama.cpp build actually provides.
linecodeLocalModelGpuVulkan=true
linecodeLocalModelGpuOpenCL=true
# NPU acceleration is not supported yet. Upstream llama.cpp's only NPU backend is
# the Qualcomm Hexagon one, and building it requires the Qualcomm Hexagon SDK
# (its HTP skels are compiled with the Hexagon toolchain). Requiring a vendor
# account to build a release is not a trade this project makes, so there is no
# NPU switch here. GPU acceleration through Vulkan and OpenCL needs no SDK.

# Point this at an existing llama.cpp checkout to build offline instead of
# fetching the pinned revision.
linecodeLlamaCppSourceDir=
linecodeLlamaCppGitTag=b11201
