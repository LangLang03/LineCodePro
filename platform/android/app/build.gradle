abstract class StageHuxerUIAssets extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getPackageDirectories()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Inject
    abstract FileSystemOperations getFileSystemOperations()

    @TaskAction
    void stage() {
        def resourcePackage = packageDirectories.files.find { new File(it, "huxerui/resources.bin").isFile() }
        if (resourcePackage == null) {
            throw new GradleException("HuxerUI resource package is missing from the built Android ABIs")
        }
        fileSystemOperations.sync {
            from resourcePackage
            into outputDirectory
        }
    }
}

// Copies a variant's APK to a stable name that carries the release version and
// which of the two builds produced it.
//
// `assembleDebug` and `assembleRelease` write the same `app-*.apk` for both the
// slim build and the local-model build, so building one after the other silently
// replaced the previous artifact. The copy is what makes the two coexist: the
// intermediate file keeps its Gradle name and stays where AGP puts it.
abstract class DistributeApk extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.NONE)
    abstract DirectoryProperty getApkDirectory()

    @Input
    abstract Property<String> getFileBaseName()

    @OutputFile
    abstract RegularFileProperty getTargetApk()

    @OutputFile
    abstract RegularFileProperty getTargetChecksum()

    @TaskAction
    void distribute() {
        def candidates = apkDirectory.get().asFile.listFiles()?.findAll {
            it.isFile() && it.name.endsWith(".apk")
        } ?: []
        if (candidates.size() != 1) {
            throw new GradleException(
                    "expected exactly one APK in ${apkDirectory.get().asFile} but found ${candidates.size()}")
        }
        def target = targetApk.get().asFile
        target.parentFile.mkdirs()
        java.nio.file.Files.copy(candidates[0].toPath(), target.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        // The checksum is written next to the APK with the bare file name, which
        // is what `sha256sum -c` expects after both files are downloaded.
        def digest = java.security.MessageDigest.getInstance("SHA-256")
                .digest(java.nio.file.Files.readAllBytes(target.toPath()))
                .encodeHex()
                .toString()
        targetChecksum.get().asFile.text = "${digest}  ${target.name}\n"
        // The checksum names the file it belongs to, so an unexpected casing (a
        // generated artifact renamed by something else, or a case-insensitive
        // mount) would leave a checksum nobody can verify. Fail here instead of
        // publishing an artifact whose own manifest does not match it.
        def onDisk = target.parentFile.listFiles()?.findAll { it.name.equalsIgnoreCase(target.name) } ?: []
        if (onDisk.size() != 1 || onDisk[0].name != target.name) {
            throw new GradleException(
                    "expected exactly ${target.name} in ${target.parentFile} but found " +
                            onDisk.collect { it.name }.join(", "))
        }
        logger.lifecycle("Distributed ${target.name} (${target.length()} bytes)")
    }
}

def releaseSigningProperties = new Properties()
def releaseSigningFile = rootProject.file("signing.properties")
def requiredReleaseSigningProperties = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
}
def missingReleaseSigningProperties = requiredReleaseSigningProperties.findAll {
    !releaseSigningProperties.getProperty(it)?.trim()
}
def hasReleaseSigning = releaseSigningFile.isFile() && missingReleaseSigningProperties.isEmpty()
def validateReleaseSigning = tasks.register("validateReleaseSigning") {
    doLast {
        if (!releaseSigningFile.isFile()) {
            throw new GradleException("signing.properties is required for release builds")
        }
        if (!missingReleaseSigningProperties.isEmpty()) {
            throw new GradleException(
                    "signing.properties is missing required keys: ${missingReleaseSigningProperties.join(', ')}"
            )
        }
    }
}

def huxeruiProperty = { String name -> providers.gradleProperty(name).get() }
def huxeruiHome = rootProject.gradle.ext.huxeruiHome
def huxeruiLibraries = rootProject.gradle.ext.huxeruiLibraries
def huxeruiCompileSdk = huxeruiProperty("huxeruiCompileSdk").toInteger()
def huxeruiMinSdk = huxeruiProperty("huxeruiMinSdk").toInteger()
def huxeruiTargetSdk = huxeruiProperty("huxeruiTargetSdk").toInteger()
def huxeruiNdkVersion = huxeruiProperty("huxeruiNdkVersion")
def huxeruiAbis = huxeruiProperty("huxeruiAbis").split(",")
def huxeruiStl = huxeruiProperty("huxeruiStl")

// Local model build parameters. They are read here rather than hardcoded so the
// same Gradle invocation can produce both the small default artifact and the
// full local-model one:
//
//   ./gradlew :app:assembleDebug \
//       -PlinecodeEnableLocalModel=true -PlinecodeLocalModelBundle=true
//
// The native libraries are only packaged when both switches are on; a build
// that enables the backend without bundling keeps the .so files out of the APK
// so their size cost can be measured in isolation.
def linecodeBooleanProperty = { String name, String fallback ->
    def value = providers.gradleProperty(name).getOrElse(fallback)
    value.trim().toLowerCase(Locale.ROOT) in ["true", "on", "yes", "1"]
}
def linecodeStringProperty = { String name, String fallback ->
    providers.gradleProperty(name).getOrElse(fallback).trim()
}
def linecodeEnableLocalModel = linecodeBooleanProperty("linecodeEnableLocalModel", "false")
def linecodeBundleLocalModel = linecodeBooleanProperty("linecodeLocalModelBundle", "false")
def linecodeLocalModelCmakeArguments = [
        "-DLINCODE_ENABLE_LOCAL_MODEL=${linecodeEnableLocalModel ? "ON" : "OFF"}",
        "-DLINCODE_LOCAL_MODEL_BUNDLE=${linecodeBundleLocalModel ? "ON" : "OFF"}",
        "-DLINCODE_LOCAL_MODEL_GPU_VULKAN=${linecodeBooleanProperty("linecodeLocalModelGpuVulkan", "true") ? "ON" : "OFF"}",
        "-DLINCODE_LOCAL_MODEL_GPU_OPENCL=${linecodeBooleanProperty("linecodeLocalModelGpuOpenCL", "true") ? "ON" : "OFF"}",
        "-DLINCODE_LLAMA_CPP_GIT_TAG=${linecodeStringProperty("linecodeLlamaCppGitTag", "b11201")}",
]
def linecodeLlamaCppSourceDir = linecodeStringProperty("linecodeLlamaCppSourceDir", "")
if (!linecodeLlamaCppSourceDir.isEmpty()) {
    linecodeLocalModelCmakeArguments.add("-DLINCODE_LLAMA_CPP_SOURCE_DIR=${linecodeLlamaCppSourceDir}")
}

android {
    buildFeatures {
        buildConfig = true
        aidl = true
    }

    namespace = "cn.lineai"
    compileSdk = huxeruiCompileSdk
    ndkVersion = huxeruiNdkVersion

    defaultConfig {
        applicationId = "cn.lineai"
        minSdk = huxeruiMinSdk
        targetSdk = huxeruiTargetSdk
        versionCode = 41
        versionName = "1.5.1"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=${huxeruiStl}",
                        "-DHUXERUI_HOME=${huxeruiHome.absolutePath}"
                arguments.addAll(linecodeLocalModelCmakeArguments)
            }
        }

        ndk {
            // The shipped build targets phones. `-PlinecodeIncludeEmulatorAbi`
            // restores x86_64 for the screenshot harness, whose device is an
            // x86_64 emulator, so the verified artifact and the shipped
            // artifact can both exist. This has to be set here rather than per
            // build type: those filters union with these instead of replacing
            // them.
            abiFilters(*(rootProject.hasProperty("linecodeIncludeEmulatorAbi")
                    ? huxeruiAbis
                    : ["arm64-v8a"]))
        }
    }

    signingConfigs {
        lineCodeRelease {
            if (hasReleaseSigning) {
                storeFile = file(releaseSigningProperties.getProperty("storeFile"))
                storePassword = releaseSigningProperties.getProperty("storePassword")
                keyAlias = releaseSigningProperties.getProperty("keyAlias")
                keyPassword = releaseSigningProperties.getProperty("keyPassword")
            }
            // minSdk 23 devices do not understand APK Signature Scheme v2.
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
            enableV4Signing = true
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.lineCodeRelease
            }
            minifyEnabled = false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // The legacy release sets `debugSymbolLevel = "NONE"`; the NDK
            // already strips the packaged libraries, and this keeps any
            // future symbol packaging off as well.
            ndk {
                debugSymbolLevel = "NONE"
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            // A build that compiles the local model backend without bundling it
            // still links llama.cpp, so its shared libraries exist in the CMake
            // output. Excluding them here is what keeps that combination small
            // instead of quietly shipping the runtime anyway.
            if (linecodeEnableLocalModel && !linecodeBundleLocalModel) {
                excludes += ["libllama*.so", "libggml*.so", "libmtmd*.so"]
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("../../../CMakeLists.txt")
        }
    }
}

tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    dependsOn validateReleaseSigning
}

// HuxerUI's generated resource plan lives under Gradle's build directory,
// while the native dependency graph which references it is cached in .cxx.
// Keeping that cache across `clean` leaves Ninja with a dependency on a file
// Gradle has just removed and no configure step to recreate it.
tasks.named("clean").configure {
    doLast {
        delete layout.projectDirectory.dir(".cxx")
    }
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def integrationRoot = layout.buildDirectory.dir("generated/huxerui/integration/${variant.name}").get().asFile
    variant.externalNativeBuild.arguments.add("-DHUXERUI_ANDROID_APP_INTEGRATION_ROOT=${integrationRoot.absolutePath}")
    def resourceRoot = layout.buildDirectory.dir("generated/huxerui/resources/${variant.name}").get().asFile
    variant.externalNativeBuild.arguments.add("-DHUXERUI_ANDROID_RESOURCE_OUTPUT_ROOT=${resourceRoot.absolutePath}")
    def nativeLibraries = variant.artifacts.get(SingleArtifact.MERGED_NATIVE_LIBS.INSTANCE)
    def packagedAbis = nativeLibraries.map { directory ->
        new File(directory.asFile, "lib").listFiles()?.findAll { it.isDirectory() }?.sort { it.name } ?: []
    }
    def libraryFile = layout.buildDirectory.file("generated/huxerui/app-library/${variant.name}.txt").get().asFile
    def resolveLibrary = tasks.register("resolveHuxerUI${variant.name.capitalize()}AppLibrary") {
        inputs.dir(nativeLibraries)
        inputs.dir(integrationRoot)
        outputs.file(libraryFile)
        doLast {
            def applications = packagedAbis.get().collect { abiDirectory ->
                def planFile = new File(integrationRoot, "${abiDirectory.name}/app.json")
                if (!planFile.isFile()) {
                    throw new GradleException("HuxerUI application integration plan is missing: ${planFile}")
                }
                def plan = new JsonSlurper().parse(planFile)
                if (plan.schema != 1 || !(plan.target instanceof String) || !(plan.artifact instanceof String)) {
                    throw new GradleException("HuxerUI application integration plan is invalid: ${planFile}")
                }
                def fileName = new File(plan.artifact).name
                if (!fileName.startsWith("lib") || !fileName.endsWith(".so") || fileName.length() <= 6) {
                    throw new GradleException("HuxerUI application artifact must be a lib<name>.so file: ${plan.artifact}")
                }
                def libraryName = fileName.substring(3, fileName.length() - 3)
                if (libraryName == "huxerui") {
                    throw new GradleException("HuxerUI application library must not use the framework name huxerui")
                }
                if (!new File(abiDirectory, fileName).isFile()) {
                    throw new GradleException("HuxerUI application library is missing for ${abiDirectory.name}: ${fileName}")
                }
                return [target: plan.target, library: libraryName]
            }.unique()
            if (applications.size() != 1) {
                throw new GradleException("HuxerUI application target and library name must match across Android ABIs")
            }
            libraryFile.parentFile.mkdirs()
            libraryFile.setText(applications[0].library, "UTF-8")
        }
    }
    variant.buildConfigFields.put("HUXERUI_APP_LIBRARY", resolveLibrary.map { task ->
        new BuildConfigField("String", JsonOutput.toJson(task.outputs.files.singleFile.getText("UTF-8")),
                "Application library resolved from the CMake target.")
    })

    def stageAssets = tasks.register("stageHuxerUI${variant.name.capitalize()}Assets", StageHuxerUIAssets) {
        packageDirectories.from(packagedAbis.map { directories ->
            directories.collect { new File(resourceRoot, "${it.name}/package") }
        })
    }
    variant.sources.assets.addGeneratedSourceDirectory(stageAssets) { it.outputDirectory }

    // The version comes from the same `defaultConfig` literal the release
    // workflow parses, so the artifact name cannot drift from the app's own.
    def versionName = android.defaultConfig.versionName
    // The unbundled build is a size-measurement artifact, not something to ship:
    // it links llama.cpp but leaves the libraries out of the package. It carries
    // its own tag so it cannot replace the real local-model APK.
    def flavorTag
    if (!linecodeEnableLocalModel) {
        flavorTag = "slim"
    } else if (linecodeBundleLocalModel) {
        flavorTag = "localmodel"
    } else {
        flavorTag = "localmodel-unbundled"
    }
    def artifactBaseName =
            "LineCodePro-${versionName}-${flavorTag}-${variant.buildType}"
    def distRoot = rootProject.layout.projectDirectory.dir("dist")
    def distributeApk = tasks.register(
            "dist${variant.name.capitalize()}Apk", DistributeApk) {
        apkDirectory.set(variant.artifacts.get(SingleArtifact.APK.INSTANCE))
        fileBaseName.set(artifactBaseName)
        targetApk.set(distRoot.file("${artifactBaseName}.apk"))
        targetChecksum.set(distRoot.file("${artifactBaseName}.apk.sha256"))
    }
    // The assemble task is created after this callback runs, so it is matched
    // lazily instead of looked up by name.
    tasks.matching { it.name == "assemble${variant.name.capitalize()}" }
            .configureEach { finalizedBy(distributeApk) }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    if (rootProject.gradle.ext.huxeruiUsesSource) {
        implementation project(":HuxerUI")
    } else {
        implementation files(rootProject.gradle.ext.huxeruiAndroidArchive)
    }
    huxeruiLibraries.each { library ->
        implementation project(library.projectPath)
    }
}
