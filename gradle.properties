# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Reuse task outputs from the local Gradle build cache instead of rebuilding them.
# CI persists this cache between workflow runs (gradle/actions/setup-gradle restores
# ~/.gradle/caches, which contains caches/build-cache-1), so repeated CI builds only
# re-execute the tasks whose inputs actually changed.
org.gradle.caching=true

# Local GGUF models (llama.cpp) are opt-in. The default build is slim: no llama.cpp
# native libraries, no local-model Java/UI. Build the local variant with:
#   ./gradlew :app:assembleRelease -PlinecodeEnableLocalModel=true
# The llama.cpp headers and the prebuilt arm64 runtime are vendored in third_party/llama-cpp
# (override with linecodeLlamaCppSourceDir / linecodeLlamaPrebuiltDir).
linecodeEnableLocalModel=false
# Defaults to linecodeEnableLocalModel when unset.
# linecodeLocalModelBundle=true
linecodeLocalModelGpu=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true