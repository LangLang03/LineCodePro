name: CLA

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: CLA / verify
    runs-on: ubuntu-latest
    steps:
      - name: Verify CLA acceptance and signature
        shell: bash
        run: |
          set -euo pipefail
          body="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          author="@$(jq -r '.pull_request.user.login' "$GITHUB_EVENT_PATH")"
          acceptance='- [x] I have read and agree to the [Contributor License Agreement](https://github.com/LangLang03/LineCodePro/blob/master/CLA.md).'

          if ! grep -Fqx -- "$acceptance" <<<"$body"; then
            echo "::error::CLA acceptance is missing. Check the CLA box in the pull request template without changing its text."
            exit 1
          fi

          if ! grep -Fqx -- "CLA Signature: $author" <<<"$body"; then
            echo "::error::CLA signature must be exactly: CLA Signature: $author"
            exit 1
          fi

          echo "CLA accepted and electronically signed by $author."
