name: CI

on:
  push:
    branches: [master, hui-cpp]
  pull_request:
    branches: [master, hui-cpp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: C++23 / GoogleTest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libgtest-dev libsqlite3-dev libssl-dev zlib1g-dev libcurl4-openssl-dev

      - name: Install HuxerUI SDK 0.3.0
        run: curl -fsSL https://github.com/HuxerUI/HuxerUI/releases/latest/download/install.sh | sh -s -- --version 0.3.0 --yes

      - name: Configure tests
        env:
          HUXERUI_HOME: /home/runner/.local/share/HuxerUI
        run: cmake -S tests -B build/tests-ninja -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build build/tests-ninja --parallel 8

      - name: Run GoogleTest suite
        run: ctest --test-dir build/tests-ninja --output-on-failure -j8

      - name: Run fake AI server tests
        working-directory: tools
        run: python3 -m unittest test_fake_ai_server.py -v

  android:
    name: Android / lint and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android build dependencies
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Install HuxerUI SDK 0.3.0
        run: curl -fsSL https://github.com/HuxerUI/HuxerUI/releases/latest/download/install.sh | sh -s -- --version 0.3.0 --yes

      - name: Make Gradle wrapper executable
        run: chmod +x platform/android/gradlew

      - name: Lint and build debug APK
        env:
          HUXERUI_HOME: /home/runner/.local/share/HuxerUI
        run: ./platform/android/gradlew -p platform/android :app:lintDebug :app:assembleDebug --max-workers=8 --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LineCodePro-debug-${{ github.sha }}
          path: platform/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report-${{ github.sha }}
          path: platform/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
