name: CI

on:
  # Validate the pull request once. A merge to master is handled by Release,
  # so it must not run CI a second time.
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-checks:
    name: CI checks (guards + tests + lint + slim APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Restores the Gradle User Home before the build: the Gradle wrapper distribution,
      # downloaded dependencies, compiled build scripts/artifact transforms and the local
      # build cache enabled by `org.gradle.caching=true` in gradle.properties. The cache is
      # saved again at the end of the job, so later runs only re-run tasks whose inputs changed.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Cache entries written on the default branch are visible to every pull request.
          # Same-repository PRs may additionally write their own PR-scoped entries, so later
          # pushes to the same PR reuse the build cache; fork PRs stay read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          # Drop stale files restored from the cache that this build never used before saving.
          cache-cleanup: on-success

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run architecture guards
        run: ./gradlew verifyAll :app:verifyAll :arch-test:test

      - name: Run unit tests
        run: ./gradlew test :app:testDebugUnitTest

      - name: Run lint
        run: ./gradlew :app:lintDebug

      - name: Build slim debug APK
        run: ./gradlew clean :app:assembleDebug

      - name: Verify the slim APK excludes the local model runtime
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$apk"
          if unzip -l "$apk" | grep -qE 'libllama|libggml|liblinecode_local_model'; then
            echo "::error::The slim APK contains llama.cpp native libraries."
            exit 1
          fi
          for dex in $(unzip -Z1 "$apk" | grep -E '^classes[0-9]*\.dex$'); do
            if unzip -p "$apk" "$dex" | strings | grep -qE 'NativeLlamaEngine|LocalModelPage'; then
              echo "::error::The slim APK contains local-model classes."
              exit 1
            fi
          done

      - name: Build user-cert debug APK
        run: ./gradlew :app:assembleDebugUserCert

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload user-cert debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-user-cert
          path: app/build/outputs/apk/debugUserCert/export/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
