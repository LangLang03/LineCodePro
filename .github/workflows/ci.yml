name: CI

# Push only. A push to a branch that has an open pull request raises both the
# `push` and the `pull_request` event, so listening to both ran every check
# twice for one commit. Fork pull requests are not tested by this workflow;
# their commits are not pushed here.
on:
  push:
    branches: [master, hui-cpp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: C++23 / GoogleTest
    runs-on: ubuntu-latest
    # Ubuntu 24.04 ships GCC 13 and the toolchain PPA only offers a March 2026
    # GCC 16 snapshot; both mis-compile this codebase (a spurious
    # -Wfree-nonheap-object, then an internal compiler error in gimplify). The
    # released GCC 16.2 that compiles it cleanly is what the official image
    # carries, so the job runs in that image rather than assembling a
    # toolchain on the runner.
    container: gcc:16.2
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        timeout-minutes: 15
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends \
            ninja-build libgtest-dev libsqlite3-dev libssl-dev zlib1g-dev \
            libcurl4-openssl-dev cmake curl git ca-certificates
          g++ --version | head -1
          cmake --version | head -1

      - name: Install HuxerUI SDK 0.3.0
        timeout-minutes: 10
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            https://github.com/HuxerUI/HuxerUI/releases/latest/download/install.sh \
            | sh -s -- --version 0.3.0 --yes

      - name: Configure tests
        env:
          HUXERUI_HOME: ${{ github.workspace }}/.huxerui-sdk
        run: |
          set -euo pipefail
          # The installer writes under $HOME; keep the SDK where later steps
          # look for it rather than depending on the image's HOME.
          if [ ! -d "$HUXERUI_HOME" ]; then
            mkdir -p "$(dirname "$HUXERUI_HOME")"
            cp -a "$HOME/.local/share/HuxerUI" "$HUXERUI_HOME"
          fi
          cmake -S tests -B build/tests-ninja -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        timeout-minutes: 30
        env:
          HUXERUI_HOME: ${{ github.workspace }}/.huxerui-sdk
        run: cmake --build build/tests-ninja --parallel 8

      - name: Run GoogleTest suite
        timeout-minutes: 15
        run: ctest --test-dir build/tests-ninja --output-on-failure -j8

      - name: Run fake AI server tests
        working-directory: tools
        run: python3 -m unittest test_fake_ai_server.py -v

  android:
    name: Android / lint and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android build dependencies
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Install HuxerUI SDK 0.3.0
        run: curl -fsSL https://github.com/HuxerUI/HuxerUI/releases/latest/download/install.sh | sh -s -- --version 0.3.0 --yes

      - name: Generate HuxerUI Android library graph
        env:
          HUXERUI_HOME: /home/runner/.local/share/HuxerUI
          CMAKE_BUILD_PARALLEL_LEVEL: 8
        # `--source` names a HuxerUI *source checkout*, not this project, so
        # passing the repository root made the CLI reject it as an invalid
        # checkout. Run from the project root and let it default to the
        # working directory.
        run: /home/runner/.local/share/HuxerUI/bin/huxerui build android --profile debug

      - name: Make Gradle wrapper executable
        run: chmod +x platform/android/gradlew

      - name: Lint and build debug APK
        env:
          HUXERUI_HOME: /home/runner/.local/share/HuxerUI
        run: ./platform/android/gradlew -p platform/android :app:lintDebug :app:assembleDebug --max-workers=8 --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LineCodePro-debug-${{ github.sha }}
          path: platform/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report-${{ github.sha }}
          path: platform/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
