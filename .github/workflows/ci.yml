name: CI

# Pull requests to protected master are already checked on dev. The merge
# commit starts Release when the version changes, so it does not need CI again.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: C++23 / GoogleTest
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
    # Ubuntu 24.04 ships GCC 13 and the toolchain PPA only offers a March 2026
    # GCC 16 snapshot; both mis-compile this codebase (a spurious
    # -Wfree-nonheap-object, then an internal compiler error in gimplify). The
    # released GCC 16.2 that compiles it cleanly is what the official image
    # carries, so the job runs in that image rather than assembling a
    # toolchain on the runner.
    container: gcc:16.2
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        timeout-minutes: 15
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends \
            ninja-build ccache libgtest-dev libsqlite3-dev libssl-dev zlib1g-dev \
            libcurl4-openssl-dev cmake curl git ca-certificates \
            libgtk-4-1 libgraphene-1.0-0 libepoxy0 libsoup-3.0-0 \
            libgstreamer-plugins-base1.0-0
          # The SDK's GUI library is what those packages are for: eight test
          # targets link it, and without its GTK/GStreamer stack every one of
          # them fails at link time with undefined gtk_/gdk_/epoxy_ symbols.
          g++ --version | head -1
          cmake --version | head -1

      - name: Restore C++ compilation cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-gcc16.2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-gcc16.2-${{ runner.os }}-

      - name: Reset C++ cache statistics
        run: ccache --zero-stats

      - name: Install HuxerUI SDK 0.3.0
        timeout-minutes: 10
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            https://github.com/HuxerUI/HuxerUI/releases/latest/download/install.sh \
            | sh -s -- --version 0.3.0 --yes

      - name: Configure tests
        env:
          HUXERUI_HOME: ${{ github.workspace }}/.huxerui-sdk
        run: |
          set -euo pipefail
          # The installer writes under $HOME; keep the SDK where later steps
          # look for it rather than depending on the image's HOME.
          if [ ! -d "$HUXERUI_HOME" ]; then
            mkdir -p "$(dirname "$HUXERUI_HOME")"
            cp -a "$HOME/.local/share/HuxerUI" "$HUXERUI_HOME"
          fi
          cmake -S tests -B build/tests-ninja -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build tests
        timeout-minutes: 30
        env:
          HUXERUI_HOME: ${{ github.workspace }}/.huxerui-sdk
        run: cmake --build build/tests-ninja --parallel 8

      - name: Report C++ cache statistics
        run: ccache --show-stats

      - name: Run GoogleTest suite
        timeout-minutes: 15
        run: ctest --test-dir build/tests-ninja --output-on-failure -j8

      - name: Run fake AI server tests
        working-directory: tools
        run: python3 -m unittest test_fake_ai_server.py -v

  android:
    name: Android / lint and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # dev is not the default branch, so setup-gradle otherwise reads
          # caches without writing the updated dependency/build cache back.
          cache-read-only: false

      - name: Install Android build dependencies
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Install HuxerUI SDK 0.3.0
        run: curl -fsSL https://github.com/HuxerUI/HuxerUI/releases/latest/download/install.sh | sh -s -- --version 0.3.0 --yes

      - name: Generate HuxerUI Android library graph
        env:
          HUXERUI_HOME: /home/runner/.local/share/HuxerUI
        run: bash tools/generate_android_library_graph.sh

      - name: Make Gradle wrapper executable
        run: chmod +x platform/android/gradlew

      - name: Lint and build debug APK
        env:
          HUXERUI_HOME: /home/runner/.local/share/HuxerUI
        run: ./platform/android/gradlew -p platform/android :app:lintDebug :app:assembleDebug --build-cache --max-workers=8 --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LineCodePro-debug-${{ github.sha }}
          path: platform/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report-${{ github.sha }}
          path: platform/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
