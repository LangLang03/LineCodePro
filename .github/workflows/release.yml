name: Release

# Automatic releases hang off the version file, the way the Java repository's
# workflow did with its own build file: merging a version bump to master is
# what starts a release. An earlier revision triggered only on `v*` tags, and
# because the migration never pushed one, the release had not run since
# 2026-09-05. Manual dispatch stays available for re-releasing.
on:
  push:
    branches: [master]
    paths:
      - 'platform/android/app/build.gradle'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    name: Signed Android release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # The SDK manager sometimes stalls on one download; bound the step so a
      # slow mirror fails on its own instead of consuming the job's budget.
      - name: Install Android build dependencies
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # The runner already has the Android SDK. setup-android@v3 tries to
          # install the removed `tools` package and fails before this step.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Install HuxerUI SDK 0.3.0
        timeout-minutes: 10
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            https://github.com/HuxerUI/HuxerUI/releases/latest/download/install.sh \
            | sh -s -- --version 0.3.0 --yes

      - name: Generate HuxerUI Android library graph
        timeout-minutes: 30
        env:
          HUXERUI_HOME: /home/runner/.local/share/HuxerUI
        run: bash tools/generate_android_library_graph.sh

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linecode-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/linecode-signing/release.keystore"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/linecode-signing/release.keystore"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > platform/android/signing.properties

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' platform/android/app/build.gradle | head -n1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' platform/android/app/build.gradle | head -n1)"
          test -n "$version_name"
          test -n "$version_code"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Releasing $version_name (code $version_code)"

      # Two independent artifacts are built and published: the slim APK, which
      # carries no llama.cpp at all, and the local-model APK, which does. They
      # are built in separate invocations because the switch is a build
      # parameter, and the Gradle `dist` task names each one after the build
      # that produced it so neither can replace the other.
      - name: Build signed slim release APK
        timeout-minutes: 60
        env:
          HUXERUI_HOME: /home/runner/.local/share/HuxerUI
        run: |
          set -euo pipefail
          chmod +x platform/android/gradlew
          ./platform/android/gradlew -p platform/android \
            :app:validateReleaseSigning :app:assembleRelease \
            --build-cache --max-workers=8 --console=plain

      # llama.cpp is resolved from the pinned revision by CMake. The job needs
      # network access for that clone; the pin keeps the runtime reproducible.
      - name: Build signed local model release APK
        timeout-minutes: 90
        env:
          HUXERUI_HOME: /home/runner/.local/share/HuxerUI
        run: |
          set -euo pipefail
          ./platform/android/gradlew -p platform/android \
            :app:assembleRelease \
            --build-cache --max-workers=8 --console=plain \
            -PlinecodeEnableLocalModel=true \
            -PlinecodeLocalModelBundle=true

      - name: Verify the local model APK carries the runtime
        run: |
          set -euo pipefail
          apk="$(ls platform/android/dist/*-localmodel-release.apk)"
          test -n "$apk"
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libllama.so"
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libggml"
          slim="$(ls platform/android/dist/*-slim-release.apk)"
          test -n "$slim"
          # The slim artifact must stay free of the runtime, which is the whole
          # point of keeping the two builds apart.
          if unzip -l "$slim" | grep -qiE "lib/arm64-v8a/(libllama|libggml)"; then
            echo "slim APK unexpectedly contains llama.cpp libraries" >&2
            exit 1
          fi

      - name: Prepare release artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for build in slim localmodel; do
            cp "platform/android/dist/LineCodePro-${VERSION_NAME}-${build}-release.apk" \
               "artifacts/LineCodePro-${VERSION_NAME}-${build}.apk"
          done
          # Checksum the bare file name from inside `artifacts`. Hashing the
          # path wrote "artifacts/LineCodePro-....apk" into the file, which no
          # longer matches once a user downloads the files side by side.
          (
            cd artifacts
            for build in slim localmodel; do
              sha256sum "LineCodePro-${VERSION_NAME}-${build}.apk" \
                > "LineCodePro-${VERSION_NAME}-${build}.apk.sha256"
            done
          )
          cat artifacts/*.sha256

      # Release notes come from `update.md`: take the block for the version
      # being released, the way the Java repository's workflow did, and fall
      # back to recent commits when the file carries no such block.
      - name: Generate release notes
        id: notes
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          notes=version_notes.md
          if [ -f update.md ]; then
            awk -v target="## v${VERSION_NAME}" '
              /^## v/ {
                if ($0 == target) { in_block = 1 }
                else if (in_block) { in_block = 0 }
              }
              in_block { print }
            ' update.md > "$notes"
          else
            : > "$notes"
          fi

          {
            echo "## LineCode Pro v${VERSION_NAME}"
            echo
            echo "### 版本信息"
            echo "- 版本名称: v${VERSION_NAME}"
            echo "- 版本号: ${{ steps.version.outputs.code }}"
            echo
            if [ -s "$notes" ]; then
              cat "$notes"
            else
              echo "### 最近更新"
              git log --oneline -n 20 || true
            fi
            echo
            echo "---"
            echo
            echo "### 下载说明"
            echo "- \`LineCodePro-${VERSION_NAME}-slim.apk\`: 精简版，不含本地模型后端，体积最小"
            echo "- \`LineCodePro-${VERSION_NAME}-localmodel.apk\`: 本地模型版，内置 llama.cpp"
            echo "  （GGUF 模型文件需自行在应用内导入；GPU 加速取决于设备）"
            echo "- 校验文件: 两个 APK 各自带一个 \`.sha256\`"
            echo "- 两个包版本号相同，安装其一即可；本地模型版体积明显更大"
          } > release_notes.md
          cat release_notes.md

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineCodePro-${{ steps.version.outputs.name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: LineCode Pro v${{ steps.version.outputs.name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: artifacts/*

      - name: Remove signing material
        if: always()
        run: |
          rm -f platform/android/signing.properties release_notes.md version_notes.md
          rm -rf "$RUNNER_TEMP/linecode-signing"
