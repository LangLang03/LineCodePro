name: Release

# Automatic releases hang off the version file, the way the Java repository's
# workflow did with its own build file: merging a version bump to master is
# what starts a release. An earlier revision triggered only on `v*` tags, and
# because the migration never pushed one, the release had not run since
# 2026-09-05. Manual dispatch stays available for re-releasing.
on:
  push:
    branches: [master]
    paths:
      - 'platform/android/app/build.gradle'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    name: Signed Android release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The SDK manager sometimes stalls on one download; bound the step so a
      # slow mirror fails on its own instead of consuming the job's budget.
      - name: Install Android build dependencies
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Install HuxerUI SDK 0.3.0
        timeout-minutes: 10
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            https://github.com/HuxerUI/HuxerUI/releases/latest/download/install.sh \
            | sh -s -- --version 0.3.0 --yes

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linecode-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/linecode-signing/release.keystore"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/linecode-signing/release.keystore"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > platform/android/signing.properties

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' platform/android/app/build.gradle | head -n1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' platform/android/app/build.gradle | head -n1)"
          test -n "$version_name"
          test -n "$version_code"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Releasing $version_name (code $version_code)"

      - name: Build signed release APK
        timeout-minutes: 60
        env:
          HUXERUI_HOME: /home/runner/.local/share/HuxerUI
        run: |
          set -euo pipefail
          chmod +x platform/android/gradlew
          ./platform/android/gradlew -p platform/android \
            :app:validateReleaseSigning :app:assembleRelease \
            --max-workers=8 --console=plain

      - name: Prepare release artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp platform/android/app/build/outputs/apk/release/app-release.apk "artifacts/LineCodePro-$VERSION_NAME.apk"
          # Checksum the bare file name from inside `artifacts`. Hashing the
          # path wrote "artifacts/LineCodePro-....apk" into the file, which no
          # longer matches once a user downloads the two files side by side.
          (
            cd artifacts
            sha256sum "LineCodePro-$VERSION_NAME.apk" > "LineCodePro-$VERSION_NAME.apk.sha256"
          )
          cat "artifacts/LineCodePro-$VERSION_NAME.apk.sha256"

      # Release notes come from `update.md`: take the block for the version
      # being released, the way the Java repository's workflow did, and fall
      # back to recent commits when the file carries no such block.
      - name: Generate release notes
        id: notes
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          notes=version_notes.md
          if [ -f update.md ]; then
            awk -v target="## v${VERSION_NAME}" '
              /^## v/ {
                if ($0 == target) { in_block = 1 }
                else if (in_block) { in_block = 0 }
              }
              in_block { print }
            ' update.md > "$notes"
          else
            : > "$notes"
          fi

          {
            echo "## LineCode Pro v${VERSION_NAME}"
            echo
            echo "### 版本信息"
            echo "- 版本名称: v${VERSION_NAME}"
            echo "- 版本号: ${{ steps.version.outputs.code }}"
            echo
            if [ -s "$notes" ]; then
              cat "$notes"
            else
              echo "### 最近更新"
              git log --oneline -n 20 || true
            fi
            echo
            echo "---"
            echo
            echo "### 下载说明"
            echo "- 下载 \`LineCodePro-${VERSION_NAME}.apk\` 直接安装"
            echo "- 校验文件: \`LineCodePro-${VERSION_NAME}.apk.sha256\`"
          } > release_notes.md
          cat release_notes.md

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineCodePro-${{ steps.version.outputs.name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: LineCode Pro v${{ steps.version.outputs.name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: artifacts/*

      - name: Remove signing material
        if: always()
        run: |
          rm -f platform/android/signing.properties release_notes.md version_notes.md
          rm -rf "$RUNNER_TEMP/linecode-signing"
